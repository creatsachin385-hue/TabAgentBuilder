name: Build APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and extract zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d extracted/
          INNER=$(find extracted -name "build.gradle" | head -1 | xargs dirname)
          echo "Project root: $INNER"
          mkdir -p project
          cp -r "$INNER"/. project/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('project/**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x project/gradlew

      - name: Build Debug APK
        working-directory: project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TabAgent-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
